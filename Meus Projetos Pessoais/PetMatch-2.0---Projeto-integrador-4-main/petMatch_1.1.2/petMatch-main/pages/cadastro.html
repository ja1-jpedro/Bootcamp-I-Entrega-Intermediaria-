<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - PetMatch</title>
  <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">

      <div class="login-form">
        <img src="../assets/img/petMatch.png" alt="Logo PetMatch" class="logo">

        <h1>Crie sua conta ♡</h1>

        <p>
          Cadastre-se para encontrar pets resgatados e ajudar
          novos amigos a ganharem um lar.
        </p>

        <form>
          <label for="nome">Nome completo</label>
          <div class="input-box">
           
            <input type="text" id="nome" placeholder="Seu nome">
          </div>

          <label for="email">E-mail</label>
          <div class="input-box">
        
            <input type="email" id="email" placeholder="seu@email.com.br">
          </div>

          <label for="senha">Senha</label>
          <div class="input-box">
            
            <input type="password" id="senha" placeholder="Crie uma senha">
          </div>

          <label for="confirmar-senha">Confirmar senha</label>
          <div class="input-box">
            
            <input type="password" id="confirmar-senha" placeholder="Confirme sua senha">
          </div>

          <label class="terms">
            <input type="checkbox">
            Aceito os termos de uso e política de privacidade
          </label>

          <button type="submit">
            Criar conta
          </button>

          <div class="divider">
            <span></span>
            <p>ou cadastre-se com</p>
            <span></span>
          </div>

          <div class="social-buttons">
            <button type="button">G Google</button>
            <button type="button">f Facebook</button>
          </div>

          <p class="register">
            Já tem uma conta?
            <a href="./login.html">Entrar</a>
          </p>
        </form>
      </div>

      <div class="login-image"></div>

    </section>
  </main>

</body>
</html>
