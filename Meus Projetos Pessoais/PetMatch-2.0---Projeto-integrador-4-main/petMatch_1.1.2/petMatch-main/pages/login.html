<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PetMatch</title>
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">

      <div class="login-form">
        <img src="../assets/img/petMatch.png" alt="Logo PetMatch" class="logo">

        <h1>Que bom te ver novamente! ♡</h1>

        <p>
          Faça login para continuar ajudando pets a encontrarem
          um lar cheio de carinho.
        </p>

        <form>
          <label for="email">E-mail</label>
          <div class="input-box">
            
            <input type="email" id="email" placeholder="seu@email.com.br">
          </div>

          <label for="senha">Senha</label>
          <div class="input-box">
            
            <input type="password" id="senha" placeholder="Sua senha">
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" checked>
              Lembrar de mim
            </label>

            <a href="#">Esqueci minha senha</a>
          </div>

          <button type="submit">
            Entrar
          </button>

          <div class="divider">
            <span></span>
            <p>ou continue com</p>
            <span></span>
          </div>

          <div class="social-buttons">
            <button type="button">G Google</button>
            <button type="button">f Facebook</button>
          </div>

          <p class="register">
            Ainda não tem uma conta?
            <a href="#">Cadastre-se</a>
          </p>
        </form>
      </div>

      <div class="login-image">
      </div>

    </section>
  </main>

</body>
</html>
